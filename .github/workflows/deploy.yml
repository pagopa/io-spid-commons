name: Deploy

on:
  push:
    branches:
      - master

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    uses: pagopa/dx/.github/workflows/release-v1.yaml@1677605cbcd6fca87fba88b2ed5224b6b0ebede8 # main
    with:
      environment: npm-prod-cd
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
