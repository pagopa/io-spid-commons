name: Deploy

on:
  push:
    branches:
      - master

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    uses: pagopa/dx/.github/workflows/release-v1.yaml@625f02f382c33eb449cd94facb8e426bf7ae37ea # main
    with:
      environment: npm-prod-cd
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
