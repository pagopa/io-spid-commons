name: Deploy

on:
  push:
    branches:
      - master

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    uses: pagopa/dx/.github/workflows/release-v1.yaml@6abcf9bc0956833202dae18c8218b4a4bc85a7f5 # main
    with:
      environment: npm-prod-cd
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
